<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SiteWatch: uptime & SSL monitoring{% endblock %}</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --text:#1a1d23; --muted:#5f6670; --line:#e3e6ea;
          --accent:#2457d6; --up:#1a7f4b; --down:#c62828; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --text:#e8eaed; --muted:#9aa1ab; --line:#2c3038;
            --accent:#6c95ff; --up:#4cc38a; --down:#ff6b6b; --warn:#f0b04f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 8px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin:16px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  form.inline { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=email], input[type=text] { flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--line);
        border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button, .btn { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff;
        font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
  button.link { background:none; color:var(--muted); padding:0; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .wrap { overflow-x:auto; }
  .up { color:var(--up); font-weight:600; } .down { color:var(--down); font-weight:600; }
  .warn { color:var(--warn); } .alert { border-color:var(--down); color:var(--down); }
  .price { font-size:1.8rem; font-weight:700; }
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
