[project]
name = "officekit"
version = "1.0.0"
description = "Office automation toolkit: merge spreadsheets, PDF tools, bulk rename, CSV cleanup, table scraping."
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "pypdf>=4.0", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.scripts]
officekit = "officekit.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
